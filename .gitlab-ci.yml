stages:
  - build
  - deploy

variables:
  ECR_REPOSITORY: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/lostItem

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
  script:
    - docker build -t ${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA} -t ${ECR_REPOSITORY}:latest web/
    - docker push ${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}
    - docker push ${ECR_REPOSITORY}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - web/**/*

deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - >
      SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='lostItem'].ServiceArn" --output text)
    - aws apprunner start-deployment --service-arn ${SERVICE_ARN}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - web/**/*
