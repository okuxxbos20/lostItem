services:
  db:
    image: postgres:16
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lostitem
    volumes:
      - db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio-admin-pass1
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  # MinIO起動後にバケットを自動作成
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minio-admin-pass1;
      mc mb local/lostitem --ignore-existing;
      mc anonymous set download local/lostitem;
      "

  # ---- テスト用 ----
  db-test:
    image: postgres:16
    ports:
      - '${TEST_DB_PORT:-5555}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lostitem_test

  minio-test:
    image: minio/minio
    ports:
      - '${TEST_MINIO_PORT:-9002}:9000'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio-admin-pass1
    command: server /data

  minio-test-init:
    image: minio/mc
    depends_on:
      - minio-test
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio-test:9000 minioadmin minio-admin-pass1;
      mc mb local/lostitem-test --ignore-existing;
      mc anonymous set download local/lostitem-test;
      "

volumes:
  db-data:
  minio-data:
